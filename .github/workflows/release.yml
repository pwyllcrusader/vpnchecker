name: release

# Every merge to master that changes what ships becomes a patch release. Minor / major: "Run workflow"
# with a bump, or raise `version` in Cargo.toml in the PR (an untagged version is released as is).
on:
  push:
    branches: [master]
    paths: ['src/**', 'Cargo.toml', 'Cargo.lock', 'install.sh']
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0

      - id: next
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ "$GITHUB_EVENT_NAME" = push ] && [ -n "$last" ] \
            && git diff --quiet "$last" HEAD -- src Cargo.toml Cargo.lock install.sh; then
            echo "Nothing to release since $last"
            exit 0
          fi
          current=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if git rev-parse -q --verify "refs/tags/v$current" >/dev/null; then
            IFS=. read -r major minor patch <<< "$current"
            case $BUMP in
              patch) new="$major.$minor.$((patch + 1))" ;;
              minor) new="$major.$((minor + 1)).0" ;;
              major) new="$((major + 1)).0.0" ;;
            esac
          else
            new=$current
          fi
          echo "Releasing v$new"
          echo "version=$new" >> "$GITHUB_OUTPUT"

  release:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # master, not the triggering commit: a queued run has to build on top of the previous release commit.
      # Deploy key: on a personal account it is the only bot identity rulesets let push to master / create v* tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Set version
        run: sed -i '' "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml

      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      # Without --locked: refreshes this crate's version in Cargo.lock.
      - run: cargo test

      - name: Build universal binary
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir dist
          lipo -create -output dist/vpnchecker \
            target/aarch64-apple-darwin/release/vpnchecker \
            target/x86_64-apple-darwin/release/vpnchecker
          tar -C dist -czf vpnchecker-macos-universal.tar.gz vpnchecker
          shasum -a 256 vpnchecker-macos-universal.tar.gz > vpnchecker-macos-universal.tar.gz.sha256

      - name: Commit and tag
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --quiet || git commit -am "chore: release $VERSION"
          git tag "v$VERSION"

      - run: cargo publish --dry-run --locked

      - run: git push --atomic origin HEAD:master "v$VERSION"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" --verify-tag --title "v$VERSION" --generate-notes \
            vpnchecker-macos-universal.tar.gz \
            vpnchecker-macos-universal.tar.gz.sha256 \
            install.sh

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::warning::CARGO_REGISTRY_TOKEN is not set, crates.io skipped"
            exit 0
          fi
          cargo publish --locked
