name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Build the installer package
        run: |
          cargo build --locked
          pkg/build.sh target/debug/vpnchecker "$RUNNER_TEMP/vpnchecker.pkg"
          installer -pkginfo -pkg "$RUNNER_TEMP/vpnchecker.pkg"
