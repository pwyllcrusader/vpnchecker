[package]
name = "vpnchecker"
version = "0.1.4"
edition = "2024"
rust-version = "1.88"
description = "VPN kill switch for macOS: outbound traffic leaves only through the VPN (pf), with a wildcard domain allowlist"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pwyllcrusader/vpnchecker"
readme = "README.md"
keywords = ["vpn", "killswitch", "macos", "pf", "firewall"]
categories = ["command-line-utilities", "network-programming"]
exclude = [".vscode/", ".github/", "install.sh"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
humantime = "2.4.0"
humantime-serde = "1.1.1"
if-addrs = "0.15.0"
ipnet = { version = "2.12.2", features = ["serde"] }
nix = { version = "0.31.3", features = ["user", "fs", "socket", "signal"] }
plist = "1.10.3"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "process", "io-util", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
